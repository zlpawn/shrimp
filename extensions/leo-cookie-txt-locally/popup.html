<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Leo cookie.txt Locally</h1>
    <span id="cookie-count" class="badge">0 cookies</span>
  </div>

  <div class="field">
    <label for="domain">域名</label>
    <input type="text" id="domain" placeholder="如 cloud.intra.ke.com">
  </div>
  
  <div class="btn-grid">
    <button id="download-btn" class="btn btn-primary" title="下载为标准 Netscape 格式文件">📥 下载 cookies.txt</button>
    <button id="copy-header-btn" class="btn btn-secondary" title="复制为 HTTP Cookie 请求头格式 (k1=v1; k2=v2...)">📋 复制 Cookie 标头</button>
    <button id="copy-netscape-btn" class="btn btn-secondary" title="复制 Netscape 文本内容">📋 复制 Netscape</button>
  </div>

  <div class="section-title">Cookie 明细列表（点击单项直接复制）：</div>
  <div id="cookie-list" class="cookie-list-container">
    <div class="empty-tip">加载中...</div>
  </div>

  <details class="advanced-settings">
    <summary>高级：导出到本地 Shrimp 网关</summary>
    <div class="field" style="margin-top: 8px;">
      <label for="gateway-url">网关地址</label>
      <input type="text" id="gateway-url" placeholder="http://127.0.0.1:8788">
    </div>
    <button id="export-btn" class="btn btn-ghost">🌐 导出到网关</button>
  </details>

  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
